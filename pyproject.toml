[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "topogym"
version = "0.1.0"
description = "Gridworld environments and benchmarks for topological exploration in reinforcement learning"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Jason Carlson" }]
keywords = [
    "reinforcement-learning",
    "gymnasium",
    "topology",
    "geometry",
    "shapes",
    "exploration",
    "benchmark",
    "gridworld",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["gymnasium>=0.29", "numpy>=1.21", "gudhi>=3.8"]

[project.optional-dependencies]
testing = ["pytest>=7.0", "networkx>=3.0"]
play = ["pygame>=2.1"]
assets = ["imageio>=2.31"]  # GIF generation for the docs gallery
# Baseline/benchmark runs; never core deps. Ray RLlib supplies the
# reference algorithms (we do not reimplement PPO), rliable the
# aggregate statistics (IQM, stratified bootstrap CIs, performance
# profiles), matplotlib the published figures.
benchmarks = [
    "ray[rllib]>=2.9",
    "torch>=2.0",
    "rliable>=1.2",
    # rliable reaches pandas through arch, and that chain is narrow:
    # arch 8 rejects rliable's bootstrap call, arch 7 breaks on
    # pandas 3. These pins are what actually resolves.
    "arch>=7.2,<8",
    "pandas>=2.0,<3",
    "matplotlib>=3.7",
]
graph = ["networkx>=3.0"]  # env.graph() as a networkx.Graph

[project.urls]
Homepage = "https://github.com/jcarlson212/TopoGym"
Repository = "https://github.com/jcarlson212/TopoGym"
"Bug Tracker" = "https://github.com/jcarlson212/TopoGym/issues"

[tool.setuptools.packages.find]
include = ["topogym*"]

# The benchmark roster is read at import time, so it must ship in the
# wheel alongside the code it governs.
[tool.setuptools.package-data]
topogym = ["benchmarks.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: exercises a real training loop; deselect with -m 'not slow'",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E741"]
