# Commit gates (https://pre-commit.com): enable once with
#   pip install pre-commit && pre-commit install
# All hooks run from the contributor's own environment (language:
# system), so they exercise exactly the ruff/pytest that CI uses.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: python3 -m ruff check .
        language: system
        pass_filenames: false
        always_run: true
      - id: version-sync
        name: version sync
        entry: python3 scripts/sync_version.py --check
        language: system
        pass_filenames: false
        always_run: true
      # The full suite, but only when the staged change can affect it:
      # scripts/change_scope.py skips docs, artefacts and release
      # commits that only move version strings (the same rule CI uses).
      - id: test-gate
        name: unit tests (all must pass)
        entry: python3 scripts/change_scope.py --staged --need tests -- python3 scripts/test_gate.py --min-pass 1.0
        language: system
        pass_filenames: false
        always_run: true
      # The benchmark roster decides what a published benchmark *is*, so
      # it gets a must-pass gate of its own: the test-gate above is a
      # ratio (>= 90%), and a single drifted invariant would sail through
      # it. Cheap -- it reads the shipped CSVs, it does not generate.
      - id: benchmark-roster
        name: benchmark roster matches published splits
        entry: python3 -m pytest tests/test_splits.py -q
        language: system
        pass_filenames: false
        files: ^(topogym/benchmarks\.(json|py)|docs/splits/|scripts/benchmarks/generate_splits.py)
      # Croissant metadata is generated from the registry, so it can
      # drift silently whenever generation or certification changes.
      # It regenerates every environment, so scripts/change_scope.py
      # runs it only for changes that can alter it (not the canonical
      # layer, the baselines, or a version bump).
      - id: croissant
        name: croissant metadata is current
        entry: python3 scripts/change_scope.py --staged --need croissant -- python3 scripts/generate_croissant.py --check
        language: system
        pass_filenames: false
        always_run: true
