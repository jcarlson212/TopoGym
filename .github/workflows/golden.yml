name: Golden

# Every published id against its recorded 0.4.2 rollouts
# (COMPATIBILITY.md). About an hour of CPU, almost all of it generating
# the large worlds, so it runs only when a change could alter env
# behaviour -- the envs, generation, the core, rendering, the registry,
# or the fixtures -- and on one Python. The path filter is a cheap
# first cut; the scope job then skips changes that only move version
# strings (scripts/change_scope.py). workflow_dispatch always runs it
# (before a release, or on another version by editing the matrix).

on:
  push:
    branches: [main]
    paths:
      - "topogym/envs/**"
      - "topogym/generation/**"
      - "topogym/core/**"
      - "topogym/rendering/**"
      - "topogym/complexes/**"
      - "topogym/registry.py"
      - "topogym/spec.py"
      - "topogym/__init__.py"
      - "tests/compat/**"
      - "scripts/change_scope.py"
      - ".github/workflows/golden.yml"
  pull_request:
    paths:
      - "topogym/envs/**"
      - "topogym/generation/**"
      - "topogym/core/**"
      - "topogym/rendering/**"
      - "topogym/complexes/**"
      - "topogym/registry.py"
      - "topogym/spec.py"
      - "topogym/__init__.py"
      - "tests/compat/**"
      - "scripts/change_scope.py"
      - ".github/workflows/golden.yml"
  workflow_dispatch:

jobs:
  scope:
    # Decides which expensive checks this change needs (see
    # scripts/change_scope.py): release bumps, docs and artefacts skip
    # them; code runs what it can affect.
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.scope.outputs.tests }}
      croissant: ${{ steps.scope.outputs.croissant }}
      golden: ${{ steps.scope.outputs.golden }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: scope
        run: >-
          python scripts/change_scope.py --github-output
          --event "${{ github.event_name }}"
          --base "${{ github.event.pull_request.base.sha || github.event.before }}"
          --head "${{ github.event.pull_request.head.sha || github.sha }}"

  golden:
    needs: scope
    if: needs.scope.outputs.golden == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[testing]"
      - name: Golden rollouts
        env:
          TOPOGYM_GOLDEN: "1"
          GOLDEN_SHARD: ${{ matrix.shard }}/6
        run: pytest -q tests/compat
